[package]
name = "fluent-langneg"
description = """
A library for language and locale negotiation.
"""
version = "0.14.2"
authors = ["Zibi Braniecki <zibi@unicode.org>"]
homepage = "http://projectfluent.org/"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/projectfluent/fluent-langneg-rs"
readme = "README.md"
categories = ["internationalization", "localization"]
edition = "2021"
include = ["src/**/*", "benches/*.rs", "Cargo.toml", "README.md"]

[badges]
travis-ci = { repository = "projectfluent/fluent-langneg-rs" }
coveralls = { repository = "projectfluent/fluent-langneg-rs", branch = "master", service = "github" }

maintenance = { status = "actively-developed" }

[dependencies]
#icu_locale_core = { version = "2.2", features = ["alloc"] }
#icu_locale = { version = "2.2", optional = true }
icu_locale_core = { git = "https://github.com/unicode-org/icu4x", rev = "59040cc32049027f9d049ea6b8ee1790c2efaa57", features = [
    "alloc",
] }
icu_locale = { git = "https://github.com/unicode-org/icu4x", rev = "59040cc32049027f9d049ea6b8ee1790c2efaa57", optional = true }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
criterion = "0.7"

[[bench]]
name = "negotiate"
harness = false

[features]
default = []
cldr = ["dep:icu_locale"]
